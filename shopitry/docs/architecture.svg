<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6b8c"/></marker>
    <style>
      .t{font-size:15px;fill:#1f2a44;font-weight:600} .s{font-size:12px;fill:#44506b}
      .box{stroke-width:1.5;rx:10}
    </style>
  </defs>
  <rect width="1000" height="700" fill="#f7f9fc"/>
  <text x="500" y="32" text-anchor="middle" class="t" style="font-size:20px">ShopiTry: Microservices E-Commerce on AWS</text>

  <rect x="400" y="55" width="200" height="55" class="box" fill="#e8ecf4" stroke="#5b6b8c"/>
  <text x="500" y="88" text-anchor="middle" class="t">Users (Browser)</text>

  <rect x="190" y="160" width="620" height="105" class="box" fill="#fff4e0" stroke="#e8a33d"/>
  <text x="205" y="180" class="s">AWS CloudFront (CDN) + S3 static hosting</text>
  <rect x="225" y="195" width="250" height="52" class="box" fill="#ffffff" stroke="#e8a33d"/>
  <text x="350" y="226" text-anchor="middle" class="t">Storefront (React)</text>
  <rect x="525" y="195" width="250" height="52" class="box" fill="#ffffff" stroke="#e8a33d"/>
  <text x="650" y="226" text-anchor="middle" class="t">Admin Dashboard (React)</text>

  <rect x="300" y="305" width="400" height="62" class="box" fill="#e3f0ff" stroke="#3b82f6"/>
  <text x="500" y="332" text-anchor="middle" class="t">API Gateway Service  (EC2 :5000)</text>
  <text x="500" y="352" text-anchor="middle" class="s">JWT auth · RBAC · CORS · rate limiting · reverse proxy</text>

  <rect x="40" y="430" width="200" height="66" class="box" fill="#e6f7ee" stroke="#2f9e6b"/>
  <text x="140" y="458" text-anchor="middle" class="t">Catalog :5001</text><text x="140" y="478" text-anchor="middle" class="s">EC2 + PM2</text>
  <rect x="270" y="430" width="200" height="66" class="box" fill="#e6f7ee" stroke="#2f9e6b"/>
  <text x="370" y="458" text-anchor="middle" class="t">Cart :5002</text><text x="370" y="478" text-anchor="middle" class="s">EC2 + PM2</text>
  <rect x="500" y="430" width="200" height="66" class="box" fill="#e6f7ee" stroke="#2f9e6b"/>
  <text x="600" y="458" text-anchor="middle" class="t">Order :5003</text><text x="600" y="478" text-anchor="middle" class="s">EC2 + PM2 · state machine</text>

  <rect x="770" y="395" width="200" height="60" class="box" fill="#f3e8ff" stroke="#8b5cf6"/>
  <text x="870" y="422" text-anchor="middle" class="t">Payment :5004</text><text x="870" y="440" text-anchor="middle" class="s">AWS Lambda</text>
  <rect x="770" y="475" width="200" height="60" class="box" fill="#f3e8ff" stroke="#8b5cf6"/>
  <text x="870" y="502" text-anchor="middle" class="t">Notification :5005</text><text x="870" y="520" text-anchor="middle" class="s">AWS Lambda</text>

  <rect x="40" y="590" width="660" height="80" class="box" fill="#e9f5e9" stroke="#3f8f3f"/>
  <text x="55" y="610" class="s">MongoDB Atlas cluster (database per service)</text>
  <text x="140" y="645" text-anchor="middle" class="t">catalog_db</text>
  <text x="370" y="645" text-anchor="middle" class="t">cart_db</text>
  <text x="600" y="645" text-anchor="middle" class="t">orders_db</text>

  <g stroke="#5b6b8c" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="500" y1="110" x2="500" y2="160"/>
    <line x1="500" y1="265" x2="500" y2="305"/>
    <line x1="400" y1="367" x2="150" y2="430"/>
    <line x1="470" y1="367" x2="370" y2="430"/>
    <line x1="560" y1="367" x2="590" y2="430"/>
    <line x1="700" y1="450" x2="770" y2="425"/>
    <line x1="700" y1="475" x2="770" y2="505"/>
    <line x1="140" y1="496" x2="140" y2="590"/>
    <line x1="370" y1="496" x2="370" y2="590"/>
    <line x1="600" y1="496" x2="600" y2="590"/>
  </g>
  <text x="520" y="140" class="s">HTTPS</text>
  <text x="520" y="287" class="s">REST + JWT</text>
</svg>
